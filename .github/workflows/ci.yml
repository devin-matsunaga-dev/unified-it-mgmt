name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test --configuration Release --no-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install poller dependencies
        working-directory: services/poller
        run: pip install -e '.[dev]'

      - name: Lint and type-check poller
        working-directory: services/poller
        run: |
          ruff check .
          mypy

      - name: Test poller
        working-directory: services/poller
        run: pytest

      # The discovery service is a second deployable with its own dependency set, so it is installed,
      # linted and tested separately rather than folded into the poller's steps — one `pip install -e`
      # over both would put icmplib and pysnmp in one environment and hide a missing dependency in
      # either. WP-3.12 added nothing to this file because `dotnet test` already ran its E2E; this
      # package adds a pytest suite nothing else would run.
      - name: Install discovery dependencies
        working-directory: services/discovery
        run: pip install -e '.[dev]'

      - name: Lint and type-check discovery
        working-directory: services/discovery
        run: |
          ruff check .
          mypy

      - name: Test discovery
        working-directory: services/discovery
        run: pytest

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web-host
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Web.Host image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Web.Host/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
